[package]
name = "ombra-desktop-store"
version = "1.2.3"
description = "Ombra Desktop local profile manager"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
app = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "ombra-desktop"
path = "src/main.rs"
required-features = ["app"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
flate2 = "1"
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "=2.12.5", optional = true , features = [] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
xz2 = { version = "0.1", features = ["static"] }
zeroize = "1"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
