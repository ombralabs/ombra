name: repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure, manifest, JSON and links
    # Private repositories in this org have no Actions minutes yet.
    # The check runs automatically once the repository is public.
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python tools/check_repo.py

      - name: Compile the checker
        run: python -m py_compile tools/check_repo.py

  python-sdk:
    name: Python SDK unit and conformance tests
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK with Playwright and test dependencies
        run: python -m pip install --upgrade pip && pip install -e "./sdks/python[dev]"

      - name: Run Python SDK tests
        run: pytest -v sdks/python/tests

      - name: Verify CLI entrypoint
        run: ombrabrowser --help

  node-sdk:
    name: Node SDK / ${{ matrix.os }} / Node ${{ matrix.node }}
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.0.0", "26"]
    defaults:
      run:
        working-directory: sdks/node
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Linux XZ decoder
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Install SDK dependencies (including native addon)
        run: npm install --no-audit --no-fund

      - name: Typecheck and verify build tooling
        run: |
          npm run typecheck
          npm run test:tooling

      - name: Full unit and simulated conformance suite (POSIX engine fixtures)
        if: runner.os != 'Windows'
        run: npm test

      - name: Windows CDP and optional-loader unit tests (no fake executable launches)
        if: runner.os == 'Windows'
        run: npm test -- cdp-captcha automation-loader

      - name: Verify clean tarball imports, executable CLI and native locks
        run: npm run test:package

      - name: Native client types on minimum runtime (no browser downloads)
        if: matrix.node == '20.0.0'
        run: npm run test:native-types -- none playwright-core@1.60.0 playwright@1.60.0 puppeteer-core@22.0.0 puppeteer@22.0.0

      - name: Full native client type matrix (no browser downloads)
        if: matrix.node != '20.0.0'
        run: npm run test:native-types
